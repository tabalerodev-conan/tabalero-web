<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100b12" />
    <title>Administrar agenda — Los Tabaleros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
  </head>
  <body class="min-h-screen bg-[#100b12] px-5 py-10 text-[#f8f2e9] antialiased">
    <main class="mx-auto max-w-3xl">
      <header class="mb-10 flex items-center justify-between border-b border-white/10 pb-6">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.22em] text-[#ff3d61]">Los Tabaleros</p>
          <h1 class="mt-2 text-3xl font-bold">Administrar agenda</h1>
        </div>
        <a href="./index.html#agenda" class="text-sm text-white/65 transition hover:text-white">Volver al sitio ↗</a>
      </header>

      <p id="status-message" class="mb-6 hidden rounded-xl border border-white/10 bg-white/[0.04] p-4 text-sm" role="status" aria-live="polite"></p>

      <section id="login-section" class="rounded-2xl border border-white/10 bg-white/[0.04] p-6 sm:p-8">
        <h2 class="text-xl font-bold">Iniciar sesión</h2>
        <p class="mt-2 text-sm leading-6 text-white/60">Acceso solo para una cuenta administradora habilitada.</p>
        <form id="login-form" class="mt-6 space-y-4">
          <div>
            <label for="login-email" class="mb-2 block text-sm font-medium">Correo electrónico</label>
            <input id="login-email" type="email" autocomplete="username" required class="w-full rounded-xl border border-white/15 bg-black/20 px-4 py-3 text-white outline-none focus:border-[#9b5cff]" />
          </div>
          <div>
            <label for="login-password" class="mb-2 block text-sm font-medium">Contraseña</label>
            <input id="login-password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-white/15 bg-black/20 px-4 py-3 text-white outline-none focus:border-[#9b5cff]" />
          </div>
          <button type="submit" class="w-full rounded-full bg-[#ff3d61] px-5 py-3 font-bold transition hover:bg-rose-400 disabled:cursor-not-allowed disabled:opacity-50">Iniciar sesión</button>
        </form>
        <p class="mt-5 text-xs leading-5 text-white/45">No hay registro público. La cuenta debe crearse desde el panel de Supabase y habilitarse como administradora.</p>
      </section>

      <section id="dashboard-section" class="hidden">
        <div class="mb-6 flex flex-col justify-between gap-4 rounded-2xl border border-white/10 bg-white/[0.04] p-5 sm:flex-row sm:items-center">
          <div>
            <p class="text-xs uppercase tracking-[0.16em] text-white/45">Sesión autorizada</p>
            <p id="admin-email" class="mt-1 break-all font-medium"></p>
          </div>
          <button id="logout-button" type="button" class="w-fit rounded-full border border-white/20 px-5 py-2 text-sm font-bold transition hover:border-white/50">Cerrar sesión</button>
        </div>

        <form id="show-form" class="rounded-2xl border border-white/10 bg-white/[0.04] p-6 sm:p-8">
          <h2 class="text-xl font-bold">Agregar fecha</h2>
          <div class="mt-6 grid gap-4 sm:grid-cols-2">
            <div>
              <label for="event-date" class="mb-2 block text-sm font-medium">Fecha</label>
              <input id="event-date" name="event_date" type="date" required class="w-full rounded-xl border border-white/15 bg-black/20 px-4 py-3 text-white outline-none focus:border-[#9b5cff]" />
            </div>
            <div>
              <label for="event-city" class="mb-2 block text-sm font-medium">Ciudad</label>
              <input id="event-city" name="city" type="text" maxlength="100" required class="w-full rounded-xl border border-white/15 bg-black/20 px-4 py-3 text-white outline-none focus:border-[#9b5cff]" />
            </div>
            <div class="sm:col-span-2">
              <label for="event-venue" class="mb-2 block text-sm font-medium">Venue</label>
              <input id="event-venue" name="venue" type="text" maxlength="160" required class="w-full rounded-xl border border-white/15 bg-black/20 px-4 py-3 text-white outline-none focus:border-[#9b5cff]" />
            </div>
            <div class="sm:col-span-2">
              <label for="ticket-url" class="mb-2 block text-sm font-medium">Enlace de entradas (opcional, HTTPS)</label>
              <input id="ticket-url" name="ticket_url" type="url" maxlength="2048" placeholder="https://..." class="w-full rounded-xl border border-white/15 bg-black/20 px-4 py-3 text-white outline-none placeholder:text-white/30 focus:border-[#9b5cff]" />
            </div>
            <label class="flex items-center gap-3 text-sm text-white/80 sm:col-span-2">
              <input id="sold-out" name="sold_out" type="checkbox" class="h-4 w-4 accent-[#ff3d61]" />
              Entradas agotadas
            </label>
          </div>
          <button type="submit" class="mt-6 rounded-full bg-[#f8f2e9] px-6 py-3 font-bold text-[#100b12] transition hover:bg-[#f5c451] disabled:cursor-not-allowed disabled:opacity-50">Guardar fecha</button>
        </form>

        <section class="mt-10">
          <h2 class="text-xl font-bold">Fechas cargadas</h2>
          <div id="admin-show-list" class="mt-4 space-y-3"></div>
        </section>
      </section>
    </main>

    <script>
      const config = window.TABALEROS_SUPABASE_CONFIG;
      const loginSection = document.querySelector("#login-section");
      const dashboardSection = document.querySelector("#dashboard-section");
      const statusMessage = document.querySelector("#status-message");
      const loginForm = document.querySelector("#login-form");
      const showForm = document.querySelector("#show-form");
      const showList = document.querySelector("#admin-show-list");
      const loginButton = loginForm.querySelector('button[type="submit"]');
      const saveButton = showForm.querySelector('button[type="submit"]');
      let client;

      function showStatus(text, isError) {
        statusMessage.textContent = text;
        statusMessage.classList.remove("hidden", "border-rose-400/40", "text-rose-200", "border-emerald-400/30", "text-emerald-200");
        statusMessage.classList.add(
          isError ? "border-rose-400/40" : "border-emerald-400/30",
          isError ? "text-rose-200" : "text-emerald-200",
        );
      }

      function clearStatus() {
        statusMessage.textContent = "";
        statusMessage.classList.add("hidden");
      }

      function formatDate(dateString) {
        const date = new Date(`${dateString}T12:00:00Z`);
        return new Intl.DateTimeFormat("es-AR", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          timeZone: "UTC",
        }).format(date);
      }

      function makeAdminShow(show) {
        const item = document.createElement("article");
        item.className = "flex flex-col justify-between gap-4 rounded-xl border border-white/10 bg-white/[0.03] p-4 sm:flex-row sm:items-center";

        const details = document.createElement("div");
        const title = document.createElement("p");
        title.className = "font-bold";
        title.textContent = `${formatDate(show.event_date)} · ${show.city}`;
        const description = document.createElement("p");
        description.className = "mt-1 text-sm text-white/55";
        description.textContent = `${show.venue}${show.sold_out ? " · Sold out" : ""}`;
        details.append(title, description);
        item.append(details);

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "w-fit rounded-full border border-rose-300/30 px-4 py-2 text-xs font-bold text-rose-200 transition hover:bg-rose-400/10 disabled:opacity-50";
        deleteButton.textContent = "Eliminar";
        deleteButton.addEventListener("click", async () => {
          if (!window.confirm(`¿Eliminar la fecha de ${show.city} del ${formatDate(show.event_date)}?`)) {
            return;
          }
          deleteButton.disabled = true;
          clearStatus();
          try {
            const { data, error } = await client
              .from("shows")
              .delete()
              .eq("id", show.id)
              .select("id");
            if (error) {
              throw error;
            }
            if (!data || data.length === 0) {
              throw new Error("No se eliminó ninguna fecha. Verificá que siga existiendo y que tu sesión tenga permisos.");
            }
            showStatus("Fecha eliminada.", false);
          } catch (error) {
            console.error("No se pudo eliminar la fecha:", error);
            showStatus(error.message || "No se pudo eliminar la fecha.", true);
            deleteButton.disabled = false;
            return;
          }
          try {
            await loadAdminShows();
          } catch (error) {
            console.error("La fecha se eliminó, pero no se pudo actualizar la lista:", error);
            showStatus("La fecha se eliminó, pero no se pudo actualizar la lista. Recargá el panel.", true);
          }
        });
        item.append(deleteButton);
        return item;
      }

      async function loadAdminShows() {
        showList.replaceChildren();
        const { data, error } = await client
          .from("shows")
          .select("id, event_date, city, venue, ticket_url, sold_out")
          .order("event_date", { ascending: true });

        if (error) {
          throw error;
        }

        if (!data.length) {
          const empty = document.createElement("p");
          empty.className = "rounded-xl border border-white/10 p-4 text-sm text-white/55";
          empty.textContent = "Todavía no hay fechas cargadas.";
          showList.append(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        data.forEach((show) => fragment.append(makeAdminShow(show)));
        showList.append(fragment);
      }

      async function openDashboard(session) {
        clearStatus();
        const { data: isAdmin, error } = await client.rpc("is_show_admin");
        if (error) {
          console.error("No se pudo verificar el permiso de administración:", error);
          showStatus("No se pudo verificar el permiso. Aplicá las políticas de supabase.sql y volvé a iniciar sesión.", true);
          return;
        }
        if (isAdmin !== true) {
          showStatus("Esta cuenta inició sesión, pero no está habilitada para administrar la agenda.", true);
          return;
        }

        loginSection.classList.add("hidden");
        dashboardSection.classList.remove("hidden");
        document.querySelector("#admin-email").textContent = session.user.email || "Cuenta administradora";
        try {
          await loadAdminShows();
        } catch (loadError) {
          console.error("No se pudo cargar la agenda del panel:", loadError);
          showStatus("No se pudieron cargar las fechas. Revisá la conexión y los permisos de la tabla.", true);
        }
      }

      async function initialize() {
        if (
          !config ||
          !config.url ||
          !config.anonKey ||
          config.url.includes("TU-PROYECTO") ||
          config.anonKey.includes("TU_CLAVE")
        ) {
          loginButton.disabled = true;
          showStatus("Configurá la URL del proyecto y la clave pública en supabase-config.js antes de usar el panel.", true);
          return;
        }

        if (!window.supabase || typeof window.supabase.createClient !== "function") {
          loginButton.disabled = true;
          showStatus("No se pudo cargar Supabase. Revisá tu conexión e intentá nuevamente.", true);
          return;
        }

        client = window.supabase.createClient(config.url, config.anonKey);
        const { data, error } = await client.auth.getSession();
        if (error) {
          console.error("No se pudo recuperar la sesión:", error);
          showStatus("No se pudo verificar la sesión. Volvé a cargar la página.", true);
          return;
        }
        if (data.session) {
          await openDashboard(data.session);
        }
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearStatus();
        loginButton.disabled = true;
        const email = document.querySelector("#login-email").value.trim();
        const password = document.querySelector("#login-password").value;
        try {
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) {
            console.error("Error de inicio de sesión:", error);
            showStatus("No se pudo iniciar sesión. Revisá las credenciales y que la cuenta esté habilitada.", true);
            return;
          }
          await openDashboard(data.session);
        } catch (error) {
          console.error("Error inesperado durante el inicio de sesión:", error);
          showStatus("Ocurrió un error al iniciar sesión. Intentá nuevamente.", true);
        } finally {
          loginButton.disabled = false;
        }
      });

      showForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearStatus();
        saveButton.disabled = true;
        const ticketValue = document.querySelector("#ticket-url").value.trim();
        let ticketUrl = null;
        if (ticketValue) {
          if (!URL.canParse(ticketValue) || new URL(ticketValue).protocol !== "https:") {
            showStatus("El enlace de entradas debe ser una URL válida con HTTPS.", true);
            saveButton.disabled = false;
            return;
          }
          ticketUrl = new URL(ticketValue).href;
        }

        const formData = new FormData(showForm);
        const show = {
          event_date: formData.get("event_date"),
          city: String(formData.get("city")).trim(),
          venue: String(formData.get("venue")).trim(),
          ticket_url: ticketUrl,
          sold_out: document.querySelector("#sold-out").checked,
        };

        try {
          const { error } = await client.from("shows").insert(show);
          if (error) {
            throw error;
          }
          showForm.reset();
          showStatus("Fecha agregada a la agenda.", false);
        } catch (error) {
          console.error("No se pudo agregar la fecha:", error);
          showStatus("No se pudo guardar la fecha. Revisá los datos y los permisos.", true);
          saveButton.disabled = false;
          return;
        }
        try {
          await loadAdminShows();
        } catch (error) {
          console.error("La fecha se guardó, pero no se pudo actualizar la lista:", error);
          showStatus("La fecha se guardó, pero no se pudo actualizar la lista. Recargá el panel.", true);
        }
        saveButton.disabled = false;
      });

      document.querySelector("#logout-button").addEventListener("click", async () => {
        clearStatus();
        const { error } = await client.auth.signOut();
        if (error) {
          console.error("No se pudo cerrar la sesión:", error);
          showStatus("No se pudo cerrar la sesión. Intentá nuevamente.", true);
          return;
        }
        dashboardSection.classList.add("hidden");
        loginSection.classList.remove("hidden");
        loginForm.reset();
        showStatus("Sesión cerrada.", false);
      });

      initialize().catch((error) => {
        console.error("No se pudo inicializar el panel:", error);
        showStatus("No se pudo iniciar el panel. Revisá la configuración de Supabase.", true);
      });
    </script>
  </body>
</html>
